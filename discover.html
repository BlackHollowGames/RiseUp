<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover — RiseUp</title>

<style>
:root{
    --bg:#080b10;
    --sidebar:#090d12;
    --panel:#0d131c;
    --panel2:#111a25;
    --border:#1b2735;
    --text:#eef4fc;
    --muted:#8995a7;
    --blue:#55a7ff;
    --blueDark:#172c42;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    display:flex;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:300px;
    padding:28px 16px;
    background:var(--sidebar);
    border-right:1px solid #17202b;
    z-index:20;
}

.logo{
    padding:0 14px 28px;
    font-size:22px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo span{
    color:var(--blue);
}

.section-title{
    margin:0 14px 10px;
    color:#687487;
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
}

.navigation{
    display:grid;
    gap:4px;
    margin-bottom:30px;
}

.navigation button{
    width:100%;
    border:0;
    background:transparent;
    color:#9ba6b6;
    border-radius:11px;
    padding:14px 18px;
    font-size:18px;
    text-align:left;
    cursor:pointer;
    transition:.15s ease;
}

.navigation button:hover{
    background:#101924;
    color:#edf4fc;
}

.navigation button.active{
    background:#131f2d;
    color:#f2f7ff;
    box-shadow:inset 2px 0 var(--blue);
}

.nav-icon{
    display:inline-flex;
    width:30px;
    color:#8998aa;
}

.navigation button.active .nav-icon{
    color:var(--blue);
}

.sidebar-footer{
    position:absolute;
    left:30px;
    bottom:26px;
    color:#667184;
    font-size:12px;
}

/* MAIN */

.main{
    margin-left:300px;
    width:calc(100% - 300px);
    padding:34px 42px 60px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:28px;
}

.title{
    font-size:32px;
    font-weight:760;
    letter-spacing:-1px;
}

.search{
    width:360px;
    padding:13px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    outline:none;
    background:#0d141d;
    color:white;
    font-size:14px;
}

.search:focus{
    border-color:#397eb8;
}

/* FILTERS */

.filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.filter{
    border:1px solid var(--border);
    background:#0d131c;
    color:#929eaf;
    border-radius:8px;
    padding:9px 15px;
    cursor:pointer;
}

.filter:hover{
    color:white;
}

.filter.active{
    background:var(--blueDark);
    border-color:#2b6597;
    color:#70b9ff;
}

/* GAMES */

.games{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:18px;
}

.game{
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    cursor:pointer;
    transition:transform .18s ease,border-color .18s ease;
}

.game:hover{
    transform:translateY(-3px);
    border-color:#304459;
}

.thumbnail{
    height:165px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 30%,#22384f 0,#142333 32%,#0a0f16 72%);
}

.thumbnail::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35));
}

.game-symbol{
    position:relative;
    z-index:2;
    width:70px;
    height:70px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#17283a;
    border:1px solid #365675;
    color:#75bbff;
    font-size:27px;
    box-shadow:0 12px 35px #0007;
}

.game-info{
    padding:15px;
}

.game-name{
    font-weight:700;
    font-size:15px;
}

.game-creator{
    color:#758196;
    margin-top:5px;
    font-size:12px;
}

.game-stats{
    display:flex;
    gap:13px;
    margin-top:12px;
    color:#68768a;
    font-size:12px;
}

.empty{
    color:#778398;
    padding:35px 0;
}

/* RESPONSIVE */

@media(max-width:1100px){
    .games{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }
}

@media(max-width:850px){
    .sidebar{
        width:78px;
        padding:20px 8px;
    }

    .logo{
        font-size:0;
        text-align:center;
    }

    .logo span{
        font-size:20px;
    }

    .section-title,
    .sidebar-footer{
        display:none;
    }

    .navigation button{
        text-align:center;
        font-size:0;
        padding:15px 5px;
    }

    .nav-icon{
        width:auto;
        font-size:20px;
    }

    .main{
        margin-left:78px;
        width:calc(100% - 78px);
        padding:25px;
    }

    .header{
        align-items:flex-start;
        flex-direction:column;
    }

    .search{
        width:100%;
    }

    .games{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }
}

@media(max-width:520px){
    .games{
        grid-template-columns:1fr;
    }
}
</style>

</head>

<body>

<aside class="sidebar">

</aside>

<main class="main">

```
<header class="header">
    <div class="title">Discover</div>

    <input
        id="search"
        class="search"
        type="search"
        placeholder="Search games..."
        autocomplete="off"
    >
</header>

<div class="filters">

    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="popular">Popular</button>
    <button class="filter" data-filter="new">New</button>
    <button class="filter" data-filter="adventure">Adventure</button>
    <button class="filter" data-filter="social">Social</button>

</div>

<section class="games" id="games"></section>
```

</main>

<script>
const defaultGames=[
    {
        name:"Skyline City",
        creator:"RiseUp Studios",
        category:"popular",
        players:"1.2K",
        symbol:"◇"
    },
    {
        name:"Block District",
        creator:"BuilderOne",
        category:"social",
        players:"842",
        symbol:"□"
    },
    {
        name:"Beyond Space",
        creator:"NovaDev",
        category:"popular",
        players:"3.4K",
        symbol:"✦"
    },
    {
        name:"Neon Rush",
        creator:"PixelWorks",
        category:"new",
        players:"562",
        symbol:"◆"
    },
    {
        name:"Mystery House",
        creator:"Unknown",
        category:"adventure",
        players:"1.8K",
        symbol:"◇"
    },
    {
        name:"Creator Plaza",
        creator:"RiseUp",
        category:"social",
        players:"426",
        symbol:"✧"
    },
    {
        name:"Drift World",
        creator:"Velocity",
        category:"new",
        players:"2.1K",
        symbol:"▱"
    },
    {
        name:"The Workshop",
        creator:"GameMaker",
        category:"new",
        players:"315",
        symbol:"▣"
    }
];

let games=defaultGames;

try{
    const stored=JSON.parse(localStorage.getItem("riseup_games")||"[]");

    if(Array.isArray(stored) && stored.length){
        games=[
            ...stored.map(game=>({
                name:game.name||"Untitled Game",
                creator:game.creator||"Creator",
                category:"new",
                players:String(game.plays||0),
                symbol:"◇"
            })),
            ...defaultGames
        ];
    }
}catch(error){}

const gamesElement=document.getElementById("games");
const searchElement=document.getElementById("search");

let currentFilter="all";

function renderGames(){

    const search=searchElement.value.trim().toLowerCase();

    const filtered=games.filter(game=>{

        const matchesFilter=
            currentFilter==="all" ||
            game.category===currentFilter;

        const matchesSearch=
            game.name.toLowerCase().includes(search) ||
            game.creator.toLowerCase().includes(search);

        return matchesFilter && matchesSearch;
    });

    if(!filtered.length){
        gamesElement.innerHTML=
            '<div class="empty">No games found.</div>';
        return;
    }

    gamesElement.innerHTML=filtered.map((game,index)=>`

        <article
            class="game"
            data-index="${index}"
            onclick="openGame('${escapeValue(game.name)}')"
        >

            <div class="thumbnail">

                <div class="game-symbol">
                    ${game.symbol}
                </div>

            </div>

            <div class="game-info">

                <div class="game-name">
                    ${escapeHTML(game.name)}
                </div>

                <div class="game-creator">
                    ${escapeHTML(game.creator)}
                </div>

                <div class="game-stats">
                    <span>▶ ${escapeHTML(game.players)}</span>
                    <span>RiseUp</span>
                </div>

            </div>

        </article>

    `).join("");
}

function escapeHTML(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeValue(value){
    return String(value)
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");
}

function openGame(name){

    localStorage.setItem(
        "riseup_last_game_name",
        name
    );

    location.href="player3d.html";
}

function navigate(page){
    location.href=page;
}

document.querySelectorAll(".filter").forEach(button=>{

    button.addEventListener("click",()=>{

        document
            .querySelectorAll(".filter")
            .forEach(item=>item.classList.remove("active"));

        button.classList.add("active");

        currentFilter=button.dataset.filter;

        renderGames();
    });

});

searchElement.addEventListener("input",renderGames);

renderGames();
</script>

</body>
