<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar — RiseUp</title>

<style>
:root{
    --bg:#080b10;
    --sidebar:#090d12;
    --panel:#0d131c;
    --panel2:#111a25;
    --border:#1b2735;
    --text:#eef4fc;
    --muted:#8995a7;
    --blue:#55a7ff;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    display:flex;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:300px;
    padding:28px 16px;
    background:var(--sidebar);
    border-right:1px solid #17202b;
    z-index:20;
}

.logo{
    padding:0 14px 28px;
    font-size:22px;
    font-weight:800;
}

.logo span{
    color:var(--blue);
}

.section-title{
    margin:0 14px 10px;
    color:#687487;
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
}

.navigation{
    display:grid;
    gap:4px;
    margin-bottom:30px;
}

.navigation button{
    width:100%;
    border:0;
    background:transparent;
    color:#9ba6b6;
    border-radius:11px;
    padding:14px 18px;
    font-size:18px;
    text-align:left;
    cursor:pointer;
    transition:.15s ease;
}

.navigation button:hover{
    background:#101924;
    color:#edf4fc;
}

.navigation button.active{
    background:#131f2d;
    color:#f2f7ff;
    box-shadow:inset 2px 0 var(--blue);
}

.nav-icon{
    display:inline-flex;
    width:30px;
    color:#8998aa;
}

.navigation button.active .nav-icon{
    color:var(--blue);
}

.sidebar-footer{
    position:absolute;
    left:30px;
    bottom:26px;
    color:#667184;
    font-size:12px;
}

/* MAIN */

.main{
    margin-left:300px;
    width:calc(100% - 300px);
    padding:34px 42px 60px;
}

.page-title{
    font-size:32px;
    font-weight:760;
    letter-spacing:-1px;
    margin-bottom:28px;
}

.avatar-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 380px;
    gap:24px;
}

/* AVATAR STAGE */

.avatar-stage{
    min-height:650px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--border);
    border-radius:18px;

    background:
        radial-gradient(
            circle at 50% 32%,
            #203348 0%,
            #121d29 28%,
            #0b1017 62%,
            #080b10 100%
        );
}

.avatar-stage::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(#ffffff06 1px,transparent 1px),
        linear-gradient(90deg,#ffffff06 1px,transparent 1px);

    background-size:45px 45px;

    mask-image:linear-gradient(
        to bottom,
        transparent,
        black 20%,
        black 75%,
        transparent
    );
}

.stage-light{
    position:absolute;
    width:420px;
    height:420px;
    top:45px;
    border-radius:50%;
    background:#62b4ff0d;
    filter:blur(20px);
}

.floor{
    position:absolute;
    bottom:85px;
    width:300px;
    height:72px;
    border-radius:50%;
    background:#05080c;
    box-shadow:
        0 0 0 1px #182534,
        0 20px 60px #000;
}

/* CARTOONY RISEUP AVATAR */

.avatar{
    position:relative;
    width:230px;
    height:480px;
    z-index:5;
    transform-origin:center bottom;
    filter:drop-shadow(0 28px 25px #0009);
    transition:transform .3s ease;
}

/* HEAD */

.head{
    position:absolute;
    left:38px;
    top:0;

    width:154px;
    height:154px;

    border-radius:48%;

    background:
        radial-gradient(
            circle at 36% 25%,
            #ffffff 0%,
            #f3f4f4 26%,
            #d7dadc 65%,
            #b5bbc0 100%
        );

    box-shadow:
        inset -15px -18px 24px #8f969c33,
        inset 8px 8px 14px #ffffffaa,
        0 8px 12px #0002;
}

/* SMALL FACE MARKS */

.eye{
    position:absolute;
    width:10px;
    height:13px;
    top:67px;
    border-radius:50%;
    background:#30363c;
}

.eye.left{
    left:47px;
}

.eye.right{
    right:47px;
}

.mouth{
    position:absolute;
    width:25px;
    height:10px;
    left:64px;
    top:96px;
    border-bottom:3px solid #555d64;
    border-radius:0 0 50% 50%;
}

/* BODY */

.torso{
    position:absolute;
    left:59px;
    top:133px;

    width:112px;
    height:166px;

    border-radius:
        48px
        48px
        38px
        38px;

    background:
        linear-gradient(
            145deg,
            #f4f5f5 0%,
            #e0e3e5 38%,
            #c3c8cc 100%
        );

    box-shadow:
        inset -14px -18px 22px #8f969c33,
        inset 9px 8px 14px #ffffff88;
}

/* ARMS */

.arm{
    position:absolute;
    top:149px;

    width:42px;
    height:148px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #f4f5f5,
            #d9dddf 50%,
            #b8bec3
        );

    box-shadow:
        inset -7px -9px 12px #8d959b33,
        inset 5px 5px 8px #ffffff88;

    transform-origin:top center;

    transition:transform .3s ease;
}

.arm.left{
    left:22px;
    transform:rotate(8deg);
}

.arm.right{
    right:22px;
    transform:rotate(-8deg);
}

/* HANDS */

.hand{
    position:absolute;
    width:44px;
    height:44px;
    bottom:-18px;
    border-radius:50%;
    background:linear-gradient(145deg,#f2f3f3,#b8bec3);
}

/* LEGS */

.leg{
    position:absolute;
    top:276px;

    width:49px;
    height:166px;

    border-radius:27px;

    background:
        linear-gradient(
            145deg,
            #f1f2f2,
            #d5d9db 48%,
            #b5bbc0
        );

    box-shadow:
        inset -8px -11px 15px #8b939933,
        inset 6px 6px 10px #ffffff77;
}

.leg.left{
    left:59px;
}

.leg.right{
    right:59px;
}

/* SHOES */

.shoe{
    position:absolute;
    bottom:-7px;
    width:65px;
    height:35px;
    border-radius:50% 50% 40% 40%;
    background:#aeb5ba;
    box-shadow:inset -7px -6px 9px #777e8333;
}

.leg.left .shoe{
    left:-7px;
}

.leg.right .shoe{
    right:-7px;
}

/* CONTROL PANEL */

.controls{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
}

.control-section{
    margin-bottom:25px;
}

.control-title{
    margin-bottom:11px;
    color:#aeb8c7;
    font-size:13px;
    font-weight:700;
    letter-spacing:.5px;
}

.option-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.option{
    border:1px solid var(--border);
    background:#0a1017;
    color:#9ba7b7;
    border-radius:9px;
    padding:12px;
    cursor:pointer;
    transition:.15s ease;
}

.option:hover{
    border-color:#30465c;
    color:white;
}

.option.active{
    border-color:#397eb8;
    background:#12263b;
    color:#72bbff;
}

.save{
    width:100%;
    border:0;
    border-radius:10px;
    padding:13px;

    background:var(--blue);
    color:#07111b;

    font-size:14px;
    font-weight:800;

    cursor:pointer;
}

.save:hover{
    filter:brightness(1.08);
}

.saved{
    height:18px;
    margin-top:10px;
    text-align:center;
    color:#65b6ff;
    font-size:12px;
}

/* RESPONSIVE */

@media(max-width:1050px){

    .avatar-layout{
        grid-template-columns:1fr;
    }

    .avatar-stage{
        min-height:600px;
    }
}

@media(max-width:850px){

    .sidebar{
        width:78px;
        padding:20px 8px;
    }

    .logo{
        font-size:0;
        text-align:center;
    }

    .logo span{
        font-size:20px;
    }

    .section-title,
    .sidebar-footer{
        display:none;
    }

    .navigation button{
        text-align:center;
        font-size:0;
        padding:15px 5px;
    }

    .nav-icon{
        width:auto;
        font-size:20px;
    }

    .main{
        margin-left:78px;
        width:calc(100% - 78px);
        padding:25px;
    }
}
</style>

</head>

</main>

<script>
const defaultAvatar={
    name:"Your Avatar",
    body:"default",
    material:"clay",
    pose:"standing",
    rotation:0
};

let avatar=loadAvatar();

function loadAvatar(){

    try{

        const stored=JSON.parse(
            localStorage.getItem("riseup_avatar")||"null"
        );

        if(stored){
            return{
                ...defaultAvatar,
                ...stored
            };
        }

    }catch(error){}

    return{...defaultAvatar};
}

function saveAvatar(){

    localStorage.setItem(
        "riseup_avatar",
        JSON.stringify(avatar)
    );

    const saved=document.getElementById("saved");

    saved.textContent="Avatar saved";

    setTimeout(()=>{
        saved.textContent="";
    },1800);
}

function navigate(page){
    location.href=page;
}

const avatarElement=document.getElementById("avatar");

function updateAvatar(){

    avatarElement.style.transform="none";

    avatarElement.style.filter=
        "drop-shadow(0 28px 25px #0009)";

    const leftArm=
        document.querySelector(".arm.left");

    const rightArm=
        document.querySelector(".arm.right");

    if(avatar.body==="tall"){
        avatarElement.style.transform="scaleY(1.08)";
    }

    if(avatar.body==="compact"){
        avatarElement.style.transform="scale(.9)";
    }

    if(avatar.material==="light"){
        avatarElement.style.filter=
            "brightness(1.08) drop-shadow(0 28px 25px #0009)";
    }

    if(avatar.material==="stone"){
        avatarElement.style.filter=
            "grayscale(.65) brightness(.82) drop-shadow(0 28px 25px #0009)";
    }

    leftArm.style.transform="rotate(8deg)";
    rightArm.style.transform="rotate(-8deg)";

    if(avatar.pose==="wave"){
        rightArm.style.transform=
            "rotate(-48deg)";

        avatarElement.style.transform+=" translateY(-3px)";
    }

    if(avatar.pose==="point"){
        rightArm.style.transform=
            "rotate(-70deg)";
    }

    if(avatar.pose==="relaxed"){
        leftArm.style.transform=
            "rotate(25deg)";

        rightArm.style.transform=
            "rotate(-25deg)";
    }
}

document.querySelectorAll(".option").forEach(option=>{

    option.addEventListener("click",()=>{

        const type=option.dataset.type;
        const value=option.dataset.value;

        document
            .querySelectorAll(`[data-type="${type}"]`)
            .forEach(item=>{
                item.classList.remove("active");
            });

        option.classList.add("active");

        avatar[type]=value;

        updateAvatar();
    });

});

function restoreSelections(){

    document.querySelectorAll(".option").forEach(option=>{

        if(
            avatar[option.dataset.type]===
            option.dataset.value
        ){
            option.classList.add("active");
        }else{
            option.classList.remove("active");
        }

    });
}

restoreSelections();
updateAvatar();
</script>
